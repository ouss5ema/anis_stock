# Production compose for Stock Management on a shared OVH VPS.
# Isolated from any other application: own network, volumes, containers, env.
#
# Host Nginx (already installed for the other app) proxies:
#   https://api-stock.example.com → 127.0.0.1:${API_HOST_PORT:-3100}
#
# Do NOT publish 80/443 here — that would collide with the existing site.
# Do NOT publish PostgreSQL.
#
# Usage (as user stockapp, from /opt/stock-management/app):
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

name: stock-management

services:
  postgres:
    image: postgres:16-alpine
    container_name: stockapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA_DIR:-../data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - stockapp_net
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockapp_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: ${PORT:-3000}
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-3100}:${PORT:-3000}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - stockapp_net
    security_opt:
      - no-new-privileges:true

networks:
  stockapp_net:
    name: stockapp_net
    driver: bridge
    internal: false
