name: stock_management
description: Application mobile de gestion de stock pour distributeur commercial.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^16.2.1
  google_fonts: ^6.3.1
  intl: ^0.20.2
  decimal: ^3.2.4
  shared_preferences: ^2.5.3
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0096E0"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#0096E0"
    theme_color: "#0096E0"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
